services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civictech}
      POSTGRES_USER: ${POSTGRES_USER:-civictech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      - "5432:5432"
    volumes:
      - civictech_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civictech} -d ${POSTGRES_DB:-civictech}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civictech}:${POSTGRES_PASSWORD:-change_this_local_password}@db:5432/${POSTGRES_DB:-civictech}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret_at_least_32_chars}
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run db:spatial && npm run seed && npm run dev"

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  civictech_db:
